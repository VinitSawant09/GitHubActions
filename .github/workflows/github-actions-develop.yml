name: Restore pom.xml after FG merge into develop

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  restore-pom:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'feature/FG') &&
      github.event.pull_request.base.ref == 'develop'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # 🔥 Find commit just BEFORE merge happened
      - name: Get pre-merge commit of develop
        id: prev
        run: |
          PREV_COMMIT=$(git rev-parse HEAD~1)
          echo "PREV_COMMIT=$PREV_COMMIT" >> $GITHUB_ENV
          echo "Previous develop commit: $PREV_COMMIT"

      # Restore pom.xml from before merge
      - name: Restore pom.xml
        run: |
          git checkout $PREV_COMMIT -- pom.xml

      # Check if changes exist
      - name: Check changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "no_changes=true" >> $GITHUB_ENV
          else
            echo "no_changes=false" >> $GITHUB_ENV
          fi

      - name: Exit if no changes
        if: env.no_changes == 'true'
        run: exit 0

      # Create PR back into develop
      - name: Create Restore PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: restore-pom-${{ github.run_id }}
          title: "Restore pom.xml after feature/FG merge to develop"
          body: |
            Auto-generated PR.

            Feature branch `${{ github.event.pull_request.head.ref }}`
            was merged into `develop`, but it modified pom.xml.

            This restores pom.xml from commit:
            `${{ env.PREV_COMMIT }}`

          labels: auto-restore