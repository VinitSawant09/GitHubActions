name: Sync release commits to develop (stable cherry-pick PR)

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # 1. Checkout full history
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # -------------------------
      # 2. Capture commit info
      # -------------------------
      - name: Capture context
        run: |
          echo "COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "RELEASE_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # -------------------------
      # 3. Filter unwanted commits
      # -------------------------
      - name: Filter version/pom-only commits
        run: |
          MSG=$(git log -1 --pretty=%B $COMMIT_SHA)
          FILES=$(git diff-tree --no-commit-id --name-only -r $COMMIT_SHA)

          echo "Message: $MSG"
          echo "Files: $FILES"

          SKIP=false

          # Skip version bump commits
          if echo "$MSG" | grep -E "chore:|bump|version"; then
            SKIP=true
          fi

          # Skip if only pom.xml changed
          if [ "$FILES" = "pom.xml" ]; then
            SKIP=true
          fi

          echo "SKIP=$SKIP" >> $GITHUB_ENV

      - name: Exit if skipped
        if: env.SKIP == 'true'
        run: |
          echo "Skipping commit (version/pom-only)"
          exit 0

      # -------------------------
      # 4. Create sync branch
      # -------------------------
      - name: Create sync branch from develop
        run: |
          git checkout develop
          git pull origin develop

          SYNC_BRANCH="sync-${RELEASE_BRANCH}-${COMMIT_SHA::7}"
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> $GITHUB_ENV

          git checkout -b $SYNC_BRANCH

      # -------------------------
      # 5. Cherry-pick commit
      # -------------------------
      - name: Cherry-pick commit
        run: |
          git cherry-pick -x $COMMIT_SHA || (
            echo "Cherry-pick failed"
            git cherry-pick --abort
            exit 1
          )

      # -------------------------
      # 6. Push branch (NO FORCE)
      # -------------------------
      - name: Push sync branch
        run: |
          git push origin $SYNC_BRANCH

      # -------------------------
      # 7. Create PR to develop
      # -------------------------
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: ${{ env.SYNC_BRANCH }}
          title: "Sync release → develop: ${{ env.COMMIT_SHA }}"
          body: |
            Auto-generated PR from `${{ env.RELEASE_BRANCH }}`

            ### Commit
            ```
            ${{ env.COMMIT_SHA }}
            ```

            ### Notes
            - Ignores version bump commits
            - Ignores pom.xml-only changes
            - No force push used (stable PR state)
          labels: release-sync