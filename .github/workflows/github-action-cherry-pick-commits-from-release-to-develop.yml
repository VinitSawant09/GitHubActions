name: Sync release commits to develop (filtered cherry-pick PR)

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
  
     # 🔥 KEY FIX: ignore branch creation event
    if: github.event.before != '0000000000000000000000000000000000000000'
    
    runs-on: ubuntu-latest
    steps:
      # -------------------------
      # 1. Checkout full history
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # -------------------------
      # 2. Capture context
      # -------------------------
      - name: Capture commit details
        run: |
          echo "RELEASE_BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "COMMIT_SHA=${GITHUB_SHA}" >> $GITHUB_ENV

      # -------------------------
      # 3. Decide whether to skip commit
      # -------------------------
      - name: Filter version-bump / pom-only commits
        id: filter
        run: |
          set +e

          COMMIT_MSG=$(git log -1 --pretty=%B $COMMIT_SHA)
          echo "Commit message: $COMMIT_MSG"

          FILES=$(git diff-tree --no-commit-id --name-only -r $COMMIT_SHA)
          echo "Changed files: $FILES"

          SKIP=false

          # Skip version bump commits
          if echo "$COMMIT_MSG" | grep -E "chore:|bump|version"; then
            SKIP=true
          fi

          # Skip if ONLY pom.xml changed
          if [ "$FILES" = "pom.xml" ]; then
            SKIP=true
          fi

          echo "SKIP=$SKIP" >> $GITHUB_ENV

      # -------------------------
      # 4. Exit if nothing useful
      # -------------------------
      - name: Exit if skipped
        if: env.SKIP == 'true'
        run: |
          echo "Skipping commit (version bump or pom-only change)"
          exit 0

      # -------------------------
      # 5. Create sync branch from develop
      # -------------------------
      - name: Create sync branch
        run: |
          git checkout develop
          git pull origin develop

          SYNC_BRANCH="sync-${RELEASE_BRANCH}-${COMMIT_SHA::7}"
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> $GITHUB_ENV

          git checkout -b $SYNC_BRANCH

      # -------------------------
      # 6. Cherry-pick commit
      # -------------------------
      - name: Cherry-pick commit into develop branch
        run: |
          git cherry-pick -x $COMMIT_SHA || (
            echo "Cherry-pick failed" &&
            git cherry-pick --abort &&
            exit 1
          )

      # -------------------------
      # 7. Push sync branch
      # -------------------------
      - name: Push branch
        run: |
          git add .
          git commit -m "sync: cherry-pick ${COMMIT_SHA}" || true
          git push origin $SYNC_BRANCH

      # -------------------------
      # 8. Create Pull Request
      # -------------------------
      - name: Create PR to develop
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: ${{ env.SYNC_BRANCH }}
          title: "Sync release → develop: ${{ env.COMMIT_SHA }}"
          body: |
            Auto-generated PR from release branch `${{ env.RELEASE_BRANCH }}`.

            ### Commit
            ```
            ${{ env.COMMIT_SHA }}
            ```

            ### Notes
            - Only non-version-bump commits are synced
            - pom.xml-only changes are ignored
          labels: release-sync
