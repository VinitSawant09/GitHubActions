name: Handle release branch creation (bump develop + release version)

on:
  create:

permissions:
  contents: write
  pull-requests: write

jobs:
  versioning:
    if: startsWith(github.ref_name, 'release/')

    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Checkout repository
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # -----------------------------
      # 2. Read current develop version
      # -----------------------------
      - name: Get develop version
        id: version
        run: |
          git checkout develop

          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      # -----------------------------
      # 3. Compute new develop version
      # -----------------------------
      - name: Bump develop version
        run: |
          CLEAN_VERSION=${CURRENT_VERSION%-SNAPSHOT}

          IFS='.' read -r major minor patch <<< "$CLEAN_VERSION"

          NEW_DEV_VERSION="${major}.$((minor + 1)).0-SNAPSHOT"
          echo "NEW_DEV_VERSION=$NEW_DEV_VERSION" >> $GITHUB_ENV

      # -----------------------------
      # 4. Update develop branch
      # -----------------------------
      - name: Commit develop bump
        run: |
          git checkout develop
          mvn versions:set -DnewVersion=${NEW_DEV_VERSION} -DgenerateBackupPoms=false

          git add pom.xml
          git commit -m "chore: bump develop to ${NEW_DEV_VERSION} after release creation" || exit 0
          git push origin develop

      # -----------------------------
      # 5. Switch to release branch
      # -----------------------------
      - name: Prepare release version (remove SNAPSHOT)
        run: |
          git checkout ${{ github.ref_name }}

          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

      # -----------------------------
      # 6. Update release pom.xml
      # -----------------------------
      - name: Set release version (no SNAPSHOT)
        run: |
          mvn versions:set -DnewVersion=${RELEASE_VERSION} -DgenerateBackupPoms=false

          git add pom.xml
          git commit -m "chore: set release version ${RELEASE_VERSION}" || exit 0
          git push origin ${{ github.ref_name }}