name: Bump develop version on release branch creation (PR only)

on:
  create:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    if: startsWith(github.ref_name, 'release/')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Get current version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "CURRENT_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Bump minor version
        run: |
          IFS='.' read -r major minor patch <<< "${CURRENT_VERSION}"
          NEW_VERSION="${major}.$((minor + 1)).0"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update pom.xml
        run: |
          mvn versions:set -DnewVersion=${NEW_VERSION} -DgenerateBackupPoms=false

      - name: Create branch for PR
        run: |
          BRANCH="bump-develop-${NEW_VERSION}-${GITHUB_RUN_ID}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          git checkout -b $BRANCH
          git add pom.xml
          git commit -m "chore: bump develop version to ${NEW_VERSION} after @release creation"
          git push origin $BRANCH

      - name: Create Pull Request to develop
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: ${{ env.BRANCH }}
          title: "Bump develop version to ${NEW_VERSION}"
          body: |
            Auto-generated PR.

            Triggered by creation of `${{ github.ref_name }}`.

            This updates develop version from:
            `${{ env.CURRENT_VERSION }}` → `${{ env.NEW_VERSION }}`

          labels: version-bump
